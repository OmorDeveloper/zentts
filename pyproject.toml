[project]
name = "zentts"
version = "1.1.0"
description = "ZenTTS - a CLI text-to-speech tool for English audio, with EPUB and PDF input, chapter splitting and voice blending."
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = {text = "Proprietary"}
authors = [
    {name = "Omor", email = "omor.developer@gmail.com"}
]
keywords = ["zentts", "text-to-speech", "tts", "audio", "epub", "pdf", "cli", "english"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "beautifulsoup4>=4.12.3",
    "ebooklib>=0.18",
    "espeakng-loader>=0.2.4",
    "numpy>=2.0.2",
    "onnxruntime>=1.20.1",
    "phonemizer-fork==3.3.1",
    "pymupdf>=1.25.4",
    "pymupdf-layout>=1.25.4",
    "pymupdf4llm>=0.0.17",
    "sounddevice>=0.5.1",
    "soundfile>=0.13.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.20.1; platform_machine == 'x86_64' and sys_platform != 'darwin'",
]

[project.scripts]
zentts = "zentts:main"

[project.urls]
Homepage = "https://github.com/OmorDeveloper/zentts"
Repository = "https://github.com/OmorDeveloper/zentts"
Issues = "https://github.com/OmorDeveloper/zentts/issues"
Author = "https://www.linkedin.com/in/omardeveloper/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["zentts.py"]

[tool.hatch.build.targets.sdist]
include = ["zentts.py", "README.md", "LICENSE", "NOTICE.md", "requirements.txt"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest>=8.0.0",
    "twine>=6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the ZenTTS model files to be present",
]

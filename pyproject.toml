[project]
name = "zentts-tts"
version = "1.0.0"
description = "A CLI text-to-speech tool for English audio, supporting EPUB and PDF input with chapter splitting and voice blending."
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = {text = "MIT"}
authors = [
    {name = "Omar", email = "your-email@example.com"}
]
keywords = ["text-to-speech", "tts", "audio", "epub", "pdf", "cli", "english"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "beautifulsoup4>=4.12.3",
    "ebooklib>=0.18",
    "kokoro-onnx==0.3.9",
    "pymupdf>=1.25.4",
    "pymupdf-layout>=1.25.4",
    "pymupdf4llm>=0.0.17",
    "sounddevice>=0.5.1",
    "soundfile>=0.13.0",
]

[project.scripts]
zentts = "zentts_tts.__main__:main"

[project.urls]
Homepage = "https://github.com/OmorDeveloper/zentts"
Repository = "https://github.com/OmorDeveloper/zentts"
Issues = "https://github.com/OmorDeveloper/zentts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "twine>=6.1.0",
]
